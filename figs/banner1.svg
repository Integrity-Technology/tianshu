<svg
  width="854"
  height="200"
  viewBox="0 0 854 200"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="天枢 - LLM Content Security Attack &amp; Defense Platform"
 xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .title {
      font-size: 72px;
      font-weight: 700;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif;
      letter-spacing: 6px;
    }
    .desc {
      font-size: 18px;
      font-weight: 500;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif;
      letter-spacing: 1px;
    }
    .title, .desc {
      animation: fadeIn 1.2s ease-in-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0f2027" />
      <stop offset="50%"  stop-color="#203a43" />
      <stop offset="100%" stop-color="#2c5364" />
    </linearGradient>
  </defs>

  <!-- 底层：不透明背景，保证白色文字在任何主题下都清晰 -->
  <path fill="url(#bg)" d="M0 0L0 150Q213.5 170 427 150T854 160L854 0Z">
    <animate
      attributeName="d"
      dur="20s"
      repeatCount="indefinite"
      keyTimes="0;0.5;1"
      calcMode="spline"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1"
      values="M0 0L0 150Q213.5 170 427 150T854 160L854 0Z;
              M0 0L0 160Q213.5 140 427 160T854 150L854 0Z;
              M0 0L0 150Q213.5 170 427 150T854 160L854 0Z"
    />
  </path>

  <!-- 装饰波浪（半透明，位于文字下方区域） -->
  <path fill="url(#bg)" opacity="0.4" d="">
    <animate
      attributeName="d"
      dur="20s"
      repeatCount="indefinite"
      keyTimes="0;0.333;0.667;1"
      calcMode="spline"
      keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
      begin="0s"
      values="M0 0L0 170Q213.5 140 427 175T854 160L854 0Z;
              M0 0L0 180Q213.5 195 427 170T854 185L854 0Z;
              M0 0L0 165Q213.5 185 427 180T854 170L854 0Z;
              M0 0L0 170Q213.5 140 427 175T854 160L854 0Z"
    />
  </path>
  <path fill="url(#bg)" opacity="0.4" d="">
    <animate
      attributeName="d"
      dur="20s"
      repeatCount="indefinite"
      keyTimes="0;0.333;0.667;1"
      calcMode="spline"
      keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
      begin="-10s"
      values="M0 0L0 180Q213.5 165 427 185T854 175L854 0Z;
              M0 0L0 170Q213.5 190 427 175T854 185L854 0Z;
              M0 0L0 185Q213.5 170 427 190T854 170L854 0Z;
              M0 0L0 180Q213.5 165 427 185T854 175L854 0Z"
    />
  </path>

  <!-- 标题：中心 y=62；副标题：中心 y=122；两者间距约 30px，不再重叠 -->
  <text
    class="title"
    x="427"
    y="62"
    fill="#ffffff"
    text-anchor="middle"
    dominant-baseline="middle"
  >天枢</text>

  <text
    class="desc"
    x="427"
    y="122"
    fill="#ffffff"
    fill-opacity="0.85"
    text-anchor="middle"
    dominant-baseline="middle"
  >LLM Content Security Attack &amp; Defense Platform</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
