<svg
  xmlns="http://www.w3.org/2000/svg"
  width="860"
  height="320"
  viewBox="0 0 860 320"
  role="img"
  aria-label="天枢攻防闭环：攻击样本 → 被测大模型 → 内容安全评测 → 发现风险 → 防护策略 → 回归验证 → 攻击样本；评测同时输出评测报告与审计日志"
 xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .node  { font-size: 18px; font-weight: 600; }
    .label { font-size: 14px; font-weight: 500; fill: #9fb3c8; }
    .link  { fill: none; stroke: #6b8299; stroke-width: 2; marker-end: url(#arrow); }
    .loop  { stroke: #2ecc71; stroke-dasharray: 6 4; marker-end: url(#arrow-green); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#6b8299" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#2ecc71" />
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0f2027" />
      <stop offset="100%" stop-color="#2c5364" />
    </linearGradient>
  </defs>

  <!-- 背景：自带深色底，浅色/深色主题下都清晰 -->
  <rect width="860" height="320" rx="16" fill="url(#bg)" />

  <!-- 连线 -->
  <path class="link" d="M170 120H238" />
  <path class="link" d="M410 120H478" />
  <path class="link" d="M640 108L708 68" />
  <path class="link" d="M640 132L708 172" />
  <path class="link" d="M560 150V260H412" />
  <path class="link loop" d="M240 260H100V152" />

  <!-- 连线标签 -->
  <text class="label" x="560" y="205" transform="translate(48 0)">发现风险</text>
  <text class="label" x="170" y="283">回归验证</text>

  <!-- 节点 -->
  <rect x="30"  y="90"  width="140" height="60" rx="12" fill="#e74c3c" />
  <text class="node" x="100" y="120">⚔️ 攻击样本</text>

  <rect x="240" y="90"  width="170" height="60" rx="12" fill="#546e7a" />
  <text class="node" x="325" y="120">被测大模型</text>

  <rect x="480" y="90"  width="160" height="60" rx="12" fill="#3498db" />
  <text class="node" x="560" y="120">🧪 内容安全评测</text>

  <rect x="240" y="230" width="170" height="60" rx="12" fill="#27ae60" />
  <text class="node" x="325" y="260">🛡️ 防护策略</text>

  <rect x="710" y="40"  width="130" height="52" rx="12" fill="#f39c12" />
  <text class="node" x="775" y="66">📄 评测报告</text>

  <rect x="710" y="150" width="130" height="52" rx="12" fill="#8e44ad" />
  <text class="node" x="775" y="176">🔍 审计日志</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>