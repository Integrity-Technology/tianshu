# ============================================================================
# 天枢平台 · Nginx TLS 反向代理样例
# 放置：/etc/nginx/conf.d/tianshu.conf
# 证书：/etc/nginx/certs/tianshu.crt|key（可用 certbot / 企业 CA 签发）
# ============================================================================

# 会话/IP 限速（登录接口额外有应用层限流）
limit_req_zone $binary_remote_addr zone=tianshu_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=tianshu_login:10m rate=10r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name tianshu.example.com;
    # 生产强制 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name tianshu.example.com;

    ssl_certificate     /etc/nginx/certs/tianshu.crt;
    ssl_certificate_key /etc/nginx/certs/tianshu.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 2m;
    server_tokens off;

    # 静态资源：内容哈希不强依赖，短缓存即可
    location /assets/ {
        proxy_pass http://127.0.0.1:8848;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 登录接口：独立限速，防撞库（应用层另有 5 次锁定）
    location = /api/auth/login {
        limit_req zone=tianshu_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8848;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API / 控制台：评估、攻击任务可能长耗时，读超时放宽
    location / {
        limit_req zone=tianshu_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8848;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # 模拟靶标 / MCP 管理面不对公网开放（应用层也有回环限制）
    location ^~ /mock/ { deny all; }
    location = /mcp { deny all; }
}
