# 默认拒绝全部入站/出站；仅放行必要流量（对应 R-3.14.2-02：默认拒绝 + 白名单出网）
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-all, namespace: tianshu-attack}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-platform, namespace: tianshu-attack}
spec:
  podSelector: {matchLabels: {app: tianshu-platform}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
      ports: [{protocol: TCP, port: 8848}]
  egress:
    # DNS
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    # 受控外部模型源（白名单网段）
    - to:
        - ipBlock: {cidr: 10.20.0.0/16, except: [10.20.6.90/32]}
        - ipBlock: {cidr: 20.205.0.0/16}   # 外部模型 API 出口
      ports: [{protocol: TCP, port: 443}]
    # 靶场隔离命名空间（内网）
    - to: [{namespaceSelector: {matchLabels: {tianshu.io/pool: range}}}]
      ports: [{protocol: TCP}]
