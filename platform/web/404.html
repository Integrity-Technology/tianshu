<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>页面不存在 · 天枢攻防平台</title>
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/login.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<style>
  .nf{min-height:100vh;display:grid;place-items:center;padding:40px 20px;
      background:radial-gradient(70rem 30rem at 50% -10%,#E9EEFD 0%,rgba(233,238,253,0) 60%),var(--bg)}
  .nf-card{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--line);
      border-radius:var(--r-xl);box-shadow:var(--sh-3);padding:38px 34px;text-align:center}
  .nf-code{font-family:var(--mono);font-size:44px;font-weight:650;letter-spacing:-.03em;color:var(--brand)}
  .nf-card h1{font-size:19px;margin-top:8px}
  .nf-card p{font-size:12.5px;color:var(--text-2);line-height:1.8;margin-top:10px}
  .nf-actions{display:flex;gap:10px;justify-content:center;margin-top:22px}
</style>
</head>
<body class="auth-body">
  <div class="nf">
    <div class="nf-card">
      <div class="nf-code">404</div>
      <h1>页面不存在</h1>
      <p>你访问的路径可能已变更或输入有误。<br>返回控制台继续操作，或重新登录。</p>
      <div class="nf-actions">
        <a class="btn primary" href="/">返回控制台</a>
        <a class="btn" href="/login.html">重新登录</a>
      </div>
    </div>
  </div>
</body>
</html>
